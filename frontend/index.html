<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>软考学系</title>
    <style>
      /* 首屏闪屏（Vue 挂载后自动替换） */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f6f7fb;
      }
      #splash .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 55%, #7c3aed 100%);
        box-shadow: 0 10px 25px -5px rgb(79 70 229 / 0.35);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash .name {
        font-size: 15px;
        font-weight: 600;
        color: #4b5563;
        letter-spacing: 0.05em;
        font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.75; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="splash">
        <div class="logo"></div>
        <div class="name">软考学系</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
